[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/aqueeb/snapshade"

[workspace.dependencies]
# Every third-party version is pinned here; member crates inherit with `.workspace = true`.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
