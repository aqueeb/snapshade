[package]
name = "snapshade-platform-windows"
description = "Windows adapters for Snapshade (GDI capture, Win32 clipboard, shell, WinRT toasts). Compiles on every host; the Win32 code is cfg(windows)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
snapshade-core = { path = "../core" }
snapshade-platform-api = { path = "../platform-api" }

# Win32 / WinRT bindings go ONLY in this table so that `cargo check --workspace` on a
# macOS host sees a stub crate (D-18, D-21). windows 0.62.2 is already in Cargo.lock via
# tauri's Windows dependencies — no new package.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  # Plan 999.4-02: DXGI desktop duplication as the primary capture backend (dxgi.rs).
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Performance",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Foundation",
  "UI_Notifications",
  "Data_Xml_Dom",
] }
