# Release pipeline (PKG-01, PKG-04, PKG-06): a `v*` tag builds the notarized macOS .dmg and
# the signed Windows NSIS .exe and attaches both to a draft GitHub release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   macOS signing + notarization (Developer ID Application certificate, NOT the
#   Apple Development / Apple Distribution identities used for local builds):
#     APPLE_CERTIFICATE            base64 of the .p12 export of "Developer ID Application: …"
#     APPLE_CERTIFICATE_PASSWORD   its password
#     APPLE_SIGNING_IDENTITY       "Developer ID Application: Name (TEAMID)"
#     APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   (app-specific password) — or —
#     APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_PATH (App Store Connect API key)
#   Windows signing — Azure Artifact Signing (PKG-04, decided 2026-10-31; the installer is
#   unsigned without it; setup in docs/RELEASING.md):
#     AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET   App Registration holding the
#                                  "Artifact Signing Certificate Profile Signer" role
#   plus the repository VARIABLES (not secrets):
#     AZURE_ARTIFACT_SIGNING_ACCOUNT              the Artifact Signing account name — this
#                                  variable alone switches signing on; leave it unset until
#                                  the certificate profile exists
#     AZURE_ARTIFACT_SIGNING_ENDPOINT             e.g. https://eus.codesigning.azure.net
#     AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE  the Public Trust certificate profile
#   scripts/sign-windows.ps1 (src-tauri/tauri.windows.conf.json's signCommand) runs
#   signtool + Microsoft's signing library for snapshade.exe, the NSIS plugins, the installer
#   and the uninstaller.
#     WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD   base64 .pfx + password; test
#                                  certificates only (no CA issues downloadable keys any more)
#
# Both jobs are unsigned when the secrets are absent (macOS: an ad-hoc signature) so the
# pipeline can be exercised on a fork, or before the certificates exist; the artifacts then
# fail Gatekeeper / SmartScreen by design. Step conditions read the job-level HAS_* flags
# because the `secrets` context is not available in `if:`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.ACT }}
        with:
          workspaces: ". -> target"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Import Developer ID certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12
      - name: Build, sign, notarize, staple (.app + .dmg)
        env:
          # The tauri CLI signs with APPLE_SIGNING_IDENTITY (it overrides the local-dev
          # identity in tauri.conf.json; "-" = ad-hoc when there is no Developer ID, and
          # release-macos.sh then skips its re-sign) and notarizes + staples when the
          # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID or APPLE_API_* variables are present.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: scripts/release-macos.sh
      - name: Gatekeeper assessment of the built .app
        if: env.HAS_APPLE_IDENTITY == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          spctl --assess --type execute -vv target/release/bundle/macos/Snapshade.app
          xcrun stapler validate target/release/bundle/macos/Snapshade.app
          xcrun stapler validate target/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Snapshade-macOS
          path: target/release/bundle/dmg/*.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: target/release/bundle/dmg/*.dmg

  windows:
    runs-on: windows-latest
    env:
      # The account variable is the single on-switch: the secrets can sit in the repository
      # while identity validation is pending without turning signing (and its checks) on.
      HAS_AZURE_SIGNING: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Skipped under nektos/act (host mode): the rust-cache cleanup deletes every pre-existing binary in the REAL ~/.cargo/bin (this box lost rustup.exe on 2026-11-01).
      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.ACT }}
        with:
          workspaces: ". -> target"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Fetch the Artifact Signing client
        if: env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        run: |
          # scripts/sign-windows.ps1 signs with signtool and Microsoft's signing library
          # (Microsoft.ArtifactSigning.Client, pinned version + SHA-256) and fetches the library
          # on first use; doing that here, once, keeps the download out of the build step. The
          # hook runs under Windows PowerShell exactly as Tauri will run it.
          $dir = Join-Path $env:RUNNER_TEMP "artifact-signing-client"
          "AZURE_ARTIFACT_SIGNING_CLIENT_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:AZURE_ARTIFACT_SIGNING_CLIENT_DIR = $dir
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign-windows.ps1 -FetchClientOnly
          if ($LASTEXITCODE -ne 0) { throw "could not fetch the signing client ($LASTEXITCODE)" }
      - name: Import code-signing certificate (.pfx, test certificates only)
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          echo "SNAPSHADE_PFX=$env:RUNNER_TEMP\codesign.pfx" >> $env:GITHUB_ENV
      - name: Build the NSIS installer
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # scripts/sign-windows.ps1 (tauri.windows.conf.json's signCommand) signs through Azure
          # Artifact Signing when AZURE_ARTIFACT_SIGNING_ACCOUNT is set, with the .pfx when
          # SNAPSHADE_PFX is set, and is told not to sign when neither exists. A half-configured
          # Azure setup (account variable without the secrets) fails the build on purpose.
          if (-not $env:AZURE_ARTIFACT_SIGNING_ACCOUNT -and -not $env:SNAPSHADE_PFX) { $env:SNAPSHADE_NO_SIGN = "1" }
          bun run tauri build --bundles nsis
      - name: Verify the installer signature
        if: env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          Write-Host "$($exe.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "the installer is not validly signed ($($sig.StatusMessage))" }
      - uses: actions/upload-artifact@v4
        with:
          name: Snapshade-Windows
          path: target/release/bundle/nsis/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: target/release/bundle/nsis/*.exe
